{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peace Mind - 不安チェック</title>
    <!-- 全体的なスタイルシートを読み込む -->
    <link rel="stylesheet" href="{% static 'mentalhealth/css/peace.css' %}">
    <!-- このページ固有のスタイルシートを読み込む -->
    <link rel="stylesheet" href="{% static 'mentalhealth/css/anxiety.css' %}">
    <!-- Material Symbolsの読み込み -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <header class="feature-header">
        <h1>不安チェック</h1>
        <p class="intro-text">最近感じたことに対してすべての質問に答えると、今どの程度不安がたまっているかがわかりますよ。</p>
    </header>
    
    <section class="content-section container">
        <!-- GAD-7 Form -->
        <form id="gad7Form" class="anxiety-quiz-form">
            <div class="question-block">
                <div class="question-text">1. 緊張感や不安を感じる</div>
                <div class="options">
                    <label><input type="radio" name="gad7_q1" value="0" required> 全く違います</label>
                    <label><input type="radio" name="gad7_q1" value="1"> 数日間</label>
                    <label><input type="radio" name="gad7_q1" value="2"> 半日以上</label>
                    <label><input type="radio" name="gad7_q1" value="3"> ほぼ毎日</label>
                </div>
            </div>
            <div class="question-block">
                <div class="question-text">2. 心配を止めたりコントロールできない</div>
                <div class="options">
                    <label><input type="radio" name="gad7_q2" value="0" required> 全く違います</label>
                    <label><input type="radio" name="gad7_q2" value="1"> 数日間</label>
                    <label><input type="radio" name="gad7_q2" value="2"> 半日以上</label>
                    <label><input type="radio" name="gad7_q2" value="3"> ほぼ毎日</label>
                </div>
            </div>
            <div class="question-block">
                <div class="question-text">3. 異なることに対して過度に心配する</div>
                <div class="options">
                    <label><input type="radio" name="gad7_q3" value="0" required> 全く違います</label>
                    <label><input type="radio" name="gad7_q3" value="1"> 数日間</label>
                    <label><input type="radio" name="gad7_q3" value="2"> 半日以上</label>
                    <label><input type="radio" name="gad7_q3" value="3"> ほぼ毎日</label>
                </div>
            </div>
            <div class="question-block">
                <div class="question-text">4. リラックスが難しい</div>
                <div class="options">
                    <label><input type="radio" name="gad7_q4" value="0" required> 全く違います</label>
                    <label><input type="radio" name="gad7_q4" value="1"> 数日間</label>
                    <label><input type="radio" name="gad7_q4" value="2"> 半日以上</label>
                    <label><input type="radio" name="gad7_q4" value="3"> ほぼ毎日</label>
                </div>
            </div>
            <div class="question-block">
                <div class="question-text">5. 落ち着かず、座っているのが難しい</div>
                <div class="options">
                    <label><input type="radio" name="gad7_q5" value="0" required> 全く違います</label>
                    <label><input type="radio" name="gad7_q5" value="1"> 数日間</label>
                    <label><input type="radio" name="gad7_q5" value="2"> 半日以上</label>
                    <label><input type="radio" name="gad7_q5" value="3"> ほぼ毎日</label>
                </div>
            </div>
            <div class="question-block">
                <div class="question-text">6. すぐにイライラしたり怒りっぽくなる</div>
                <div class="options">
                    <label><input type="radio" name="gad7_q6" value="0" required> 全く違います</label>
                    <label><input type="radio" name="gad7_q6" value="1"> 数日間</label>
                    <label><input type="radio" name="gad7_q6" value="2"> 半日以上</label>
                    <label><input type="radio" name="gad7_q6" value="3"> ほぼ毎日</label>
                </div>
            </div>
            <div class="question-block">
                <div class="question-text">7. 何か恐ろしいことが起こるかのように感じる</div>
                <div class="options">
                    <label><input type="radio" name="gad7_q7" value="0" required> 全く違います</label>
                    <label><input type="radio" name="gad7_q7" value="1"> 数日間</label>
                    <label><input type="radio" name="gad7_q7" value="2"> 半日以上</label>
                    <label><input type="radio" name="gad7_q7" value="3"> ほぼ毎日</label>
                </div>
            </div>
            <button type="submit" class="action-button">結果を見る</button>
        </form>
        <div class="result-display" id="gad7_result"></div>
    </section>

    
    <!-- 全体的なJavaScriptファイルを読み込む -->
    <script src="{% static 'mentalhealth/js/peace.js' %}"></script>
    <!-- このページ固有のJavaScriptファイルを読み込む -->
    <script src="{% static 'mentalhealth/js/anxiety.js' %}"></script>

</body>
</html>
